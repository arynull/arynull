<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="rayanalpha banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b1122"/>
      <stop offset="1" stop-color="#120e24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#94a3b8" opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>

  <!-- drifting aurora blobs -->
  <g filter="url(#soft)">
    <ellipse cx="260" cy="120" rx="230" ry="150" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 90 40; -40 70; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="920" cy="260" rx="260" ry="160" fill="url(#glowV)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 -50; 60 -30; 0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="90" rx="180" ry="120" fill="url(#glowP)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 60; -70 20; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- code rain columns -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#22d3ee" opacity="0.28">
    <text x="60" y="60">def</text><text x="60" y="92">class</text><text x="60" y="124">async</text><text x="60" y="156">await</text>
    <text x="1110" y="80">λ</text><text x="1110" y="112">{ }</text><text x="1110" y="144">=&gt;</text><text x="1110" y="176">fn()</text>
  </g>

  <!-- headline -->
  <text x="600" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="92" font-weight="800" letter-spacing="2" fill="url(#name)">rayanalpha</text>
  <text x="600" y="216" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#cbd5e1" letter-spacing="1">I build tools for the agent era</text>
  <text x="600" y="252" text-anchor="middle" font-family="system-ui,'Segoe UI',Tahoma,sans-serif" font-size="19" fill="#94a3b8">سلام! 👋</text>

  <!-- status chips -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#a5b4fc">
    <rect x="470" y="282" width="120" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="530" y="302" text-anchor="middle" fill="#67e8f9">◉ shipping</text>
    <rect x="610" y="282" width="130" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="675" y="302" text-anchor="middle" fill="#c4b5fd">✦ open source</text>
  </g>

  <!-- animated waves -->
  <g opacity="0.5">
    <path d="M-600 330 Q -450 300 -300 330 T 0 330 T 300 330 T 600 330 T 900 330 T 1200 330 T 1500 330 T 1800 330 V 380 H -600 Z" fill="#22d3ee" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="600 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-600 345 Q -450 318 -300 345 T 0 345 T 300 345 T 600 345 T 900 345 T 1200 345 T 1500 345 T 1800 345 V 380 H -600 Z" fill="#a78bfa" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="600 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
