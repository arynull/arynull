name: contribution-snake

# Renders the contribution-grid snake animation (Platane/snk)
# to the `output` branch, referenced by README.md.
on:
  schedule:
    - cron: "0 3 * * *" # ~06:30 Asia/Tehran
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rayanalpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
