name: regenerate-cards

# Rebuilds the custom SVG stat cards every morning (Tehran time)
# and on demand. Cards live in assets/cards/ and are referenced
# directly by README.md — no external image service involved.
on:
  schedule:
    - cron: "30 4 * * *" # ~08:00 Asia/Tehran
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed card
        run: |
          git config user.name "rayanalpha"
          git config user.email "73559226+rayanalpha@users.noreply.github.com"
          git add assets/profile.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile card"
          git push
